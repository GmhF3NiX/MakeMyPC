<title>MakeMyPC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* Committed dark neon world (Cyberpunk-menu aesthetic) – no light variant by design. */
  :root{
    --bg:#0a0a0d;
    --bg-glow-a:#ff2a6d;
    --bg-glow-b:#00f6ff;
    --surface:#131318;
    --surface-2:#1b1b22;
    --border:#33333d;
    --border-bright:#54545f;
    --text:#eef0f2;
    --text-dim:#9a9aa8;
    --text-faint:#68687a;
    --accent-cpu:#ff2a6d;
    --accent-cpu-bg:#ff2a6d1f;
    --accent-gpu:#00f6ff;
    --accent-gpu-bg:#00f6ff1f;
    --good:#05ffa1;
    --good-bg:#05ffa11f;
    --warn:#fcee09;
    --warn-bg:#fcee091f;
    --bad:#ff2247;
    --bad-bg:#ff224722;
    --value:#fcee09;
    --value-bg:#fcee091a;
    --radius:2px;
    --cut:14px;
    --shadow:0 0 0 1px rgba(255,255,255,.02), 0 10px 26px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 8% -8%, color-mix(in srgb, var(--bg-glow-a) 16%, transparent), transparent 60%),
      radial-gradient(ellipse 900px 600px at 100% 0%, color-mix(in srgb, var(--bg-glow-b) 14%, transparent), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0px, rgba(255,255,255,.018) 1px, transparent 1px, transparent 3px),
      var(--bg);
    color:var(--text);
    font-family:'Rajdhani',system-ui,sans-serif;
    font-size:15px;
    padding-inline:16px;
    padding-block:16px;
    max-width:1180px;
    margin:0 auto;
  }
  h1,h2,h3{font-family:'Chakra Petch',ui-monospace,monospace; letter-spacing:.01em; text-wrap:balance; text-transform:uppercase;}
  .mono{font-family:'Share Tech Mono',ui-monospace,monospace;}
  .tabular{font-family:'Share Tech Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  button{font-family:'Chakra Petch',inherit;}
  select{font-family:'Chakra Petch',inherit;}
  ::selection{background:var(--accent-gpu); color:#0a0a0d;}

  /* ---- top bar ---- */
  .topbar{
    display:flex; flex-wrap:wrap; gap:14px 20px; align-items:flex-end;
    justify-content:space-between; padding-bottom:16px; margin-bottom:16px;
    border-bottom:1px solid var(--border);
  }
  .brand h1{font-size:26px; margin:0 0 4px; font-weight:700; color:var(--warn); text-shadow:0 0 18px color-mix(in srgb, var(--warn) 55%, transparent);}
  .brand p{margin:0; color:var(--text-dim); font-size:13px; max-width:50ch;}
  .budgetbox{
    display:flex; align-items:stretch; gap:10px; flex-wrap:wrap;
  }
  .field{
    display:flex; flex-direction:column; gap:4px;
  }
  .field label{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.08em;}
  .field input[type="number"]{
    font-family:'Share Tech Mono',monospace; font-size:15px; font-weight:600;
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:7px 10px; width:110px;
  }
  .field input[type="number"]:focus{outline:none; border-color:var(--accent-gpu);}
  .totalpill{
    display:flex; flex-direction:column; gap:4px; justify-content:center;
    background:var(--surface); border:1px solid var(--border);
    padding:7px 14px; min-width:160px;
  }
  .totalpill .amount{font-family:'Share Tech Mono',monospace; font-size:19px; font-weight:700;}
  .totalpill .delta{font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.02em;}
  .status-ok{color:var(--good);} .status-warn{color:var(--warn);} .status-bad{color:var(--bad);}

  /* corner-cut "cyberpunk panel" shape, reused everywhere a surface appears */
  .cut{clip-path:polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut)));}
  .cut-sm{--cut:8px;}

  /* ---- tabs ---- */
  .tabs{
    display:flex; gap:2px; background:var(--surface-2); border:1px solid var(--border);
    padding:4px; margin-bottom:20px; overflow-x:auto;
  }
  .tabs button{
    appearance:none; border:none; background:transparent; color:var(--text-dim);
    font-size:13px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; padding:9px 16px; cursor:pointer;
    white-space:nowrap; transition:background .15s, color .15s;
  }
  .tabs button[aria-selected="true"]{background:var(--accent-gpu); color:#04181a;}
  .tabs button:focus-visible{outline:2px solid var(--accent-gpu); outline-offset:2px;}

  section[role="tabpanel"]{display:flex; flex-direction:column; gap:28px;}

  /* ---- component category block ---- */
  .catblock + .catblock{border-top:1px solid var(--border); padding-top:26px;}
  .catblock .catheader{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  .catblock h2{font-size:24px; letter-spacing:.06em; margin:0; color:var(--accent-gpu); font-weight:700; text-shadow:0 0 16px color-mix(in srgb, var(--accent-gpu) 45%, transparent);}
  .catblock h2::before{content:"// "; color:var(--text-faint);}
  .catcontrols{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .vendorfilter{display:inline-flex; border:1px solid var(--border);}
  .vendorfilter button{appearance:none; border:none; background:var(--surface); color:var(--text-dim); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; padding:5px 10px; cursor:pointer;}
  .vendorfilter button + button{border-left:1px solid var(--border);}
  .vendorfilter button[aria-pressed="true"]{background:var(--accent-cpu); color:#1a0208;}
  .sortselect{font-size:11px; font-weight:600; text-transform:uppercase; background:var(--surface); border:1px solid var(--border); color:var(--text-dim); padding:5px 8px;}

  .cardgrid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px;
  }
  .card{
    text-align:left; border:1px solid var(--border); background:var(--surface);
    padding:12px; cursor:pointer; display:flex; flex-direction:column; gap:8px; position:relative;
    transition:border-color .15s;
  }
  .card:hover{border-color:var(--border-bright);}
  .card:focus-visible{outline:2px solid var(--accent-gpu); outline-offset:2px;}
  .card.selected{border-color:var(--accent-gpu); box-shadow:0 0 0 1px var(--accent-gpu), 0 0 18px -6px var(--accent-gpu);}
  .card.selected.cpu-sel{border-color:var(--accent-cpu); box-shadow:0 0 0 1px var(--accent-cpu), 0 0 18px -6px var(--accent-cpu);}
  .card .toprow{display:flex; justify-content:space-between; align-items:flex-start; gap:6px;}
  .cardicon{width:34px; height:34px; flex:none; background:var(--surface-2); border:1px solid var(--border); padding:5px;}
  .cardicon svg{width:100%; height:100%; display:block;}
  .cardicon.cpu{color:var(--accent-cpu);}
  .cardicon.gpu{color:var(--accent-gpu);}
  .cardicon.ram, .cardicon.board{color:var(--text-faint);}
  .nameblock{display:flex; align-items:center; gap:8px; min-width:0;}
  .card .name{font-weight:600; font-size:14px; font-family:'Chakra Petch',sans-serif;}
  .vendortag{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--bg); background:var(--text-dim); padding:2px 6px; flex:none;}
  .card .chips{display:flex; flex-wrap:wrap; gap:5px;}
  .chip{font-size:11px; font-family:'Share Tech Mono',monospace; background:var(--surface-2); border:1px solid var(--border); padding:2px 6px; color:var(--text-dim);}
  .idxbar-track{height:6px; background:var(--surface-2); overflow:hidden;}
  .idxbar-fill{height:100%;}
  .idxbar-fill.cpu{background:var(--accent-cpu); box-shadow:0 0 8px var(--accent-cpu);}
  .idxbar-fill.gpu{background:var(--accent-gpu); box-shadow:0 0 8px var(--accent-gpu);}
  .card .note{font-size:12px; color:var(--text-faint); line-height:1.35;}
  .valuebadge{align-self:flex-start; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--value); background:var(--value-bg); border:1px solid var(--value); padding:2px 6px;}
  .modelpicker{display:flex; border:1px solid var(--border); overflow:hidden; align-self:flex-start; flex-wrap:wrap;}
  .modelpicker button{appearance:none; border:none; background:var(--surface-2); color:var(--text-dim); font-size:11px; font-weight:600; padding:5px 9px; cursor:pointer; font-family:'Share Tech Mono',monospace;}
  .modelpicker button + button{border-left:1px solid var(--border);}
  .modelpicker button[aria-pressed="true"]{background:var(--warn); color:#1a1400;}
  .pricerow{display:flex; align-items:center; gap:6px; margin-top:auto;}
  .pricerow input[type="number"]{
    width:80px; font-family:'Share Tech Mono',monospace; font-size:13px; font-weight:700;
    background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:4px 6px;
  }
  .pricerow .eur{font-size:12px; color:var(--text-faint);}
  .pricerow .resetbtn{
    margin-left:auto; font-size:11px; color:var(--text-faint); background:none; border:none; cursor:pointer; text-decoration:underline;
  }
  .searchlink{font-size:11px; color:var(--accent-gpu); text-decoration:none; font-weight:700; text-transform:uppercase; letter-spacing:.02em;}
  .searchlink:hover{text-decoration:underline;}
  .pricedate{font-size:10px; color:var(--text-faint); font-family:'Share Tech Mono',monospace;}

  .noticebar{
    display:flex; gap:10px; align-items:flex-start; padding:10px 12px;
    font-size:13px; line-height:1.4; border-left:3px solid;
  }
  .noticebar.warn{background:var(--warn-bg); color:var(--warn); border-color:var(--warn);}
  .noticebar.info{background:var(--surface-2); color:var(--text-dim); border-color:var(--accent-gpu);}

  /* ---- overview / hero ---- */
  .herocard{background:var(--surface); border:1px solid var(--border-bright); padding:20px; display:flex; flex-direction:column; gap:14px;}
  .herotop{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  .herolabel{font-size:15px; margin:0; color:var(--warn); letter-spacing:.08em;}
  .heromgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px;}
  .heromini{display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--border); padding:8px 10px;}
  .herominitext{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .heromininame{font-size:12.5px; font-weight:600; font-family:'Chakra Petch',sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .herominiprice{font-size:12px; color:var(--accent-gpu);}
  .budgetbar{height:14px; background:var(--surface-2); border:1px solid var(--border); position:relative; overflow:hidden;}
  .budgetbar-fill{height:100%; transition:width .2s;}
  .budgetline{display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; font-size:13px;}
  .budgetline > span:first-child{font-size:20px; font-weight:700; color:var(--text);}
  .jumplink{appearance:none; border:none; background:none; color:var(--accent-gpu); font-weight:700; font-size:inherit; cursor:pointer; text-decoration:underline; padding:0; font-family:'Chakra Petch',sans-serif;}
  .quickgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px;}
  .quicktile{background:var(--surface); border:1px solid var(--border); padding:16px; display:flex; flex-direction:column; gap:4px;}
  .quicklabel{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint);}
  .quickbig{font-family:'Share Tech Mono',monospace; font-size:30px; font-weight:700; color:var(--accent-cpu); text-shadow:0 0 14px color-mix(in srgb, var(--accent-cpu) 55%, transparent);}
  .quicksub{font-size:12px; color:var(--text-dim); margin-bottom:6px;}

  /* ---- summary card ---- */
  .summarycard{
    background:var(--surface); border:1px solid var(--border); padding:16px;
    display:flex; flex-direction:column; gap:10px;
  }
  .summarygrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px;}
  .summarygrid .item{display:flex; flex-direction:column; gap:2px;}
  .summarygrid .item .k{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em;}
  .summarygrid .item .v{font-size:13px; font-weight:700;}
  .exportrow{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-top:10px; border-top:1px solid var(--border);}
  .exportbtn{appearance:none; border:1px solid var(--warn); background:var(--warn); color:#1a1400; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.04em; padding:9px 16px; cursor:pointer;}
  .exportbtn:hover{box-shadow:0 0 16px -4px var(--warn);}
  .exportbtn:disabled{opacity:.5; cursor:default; box-shadow:none;}
  .exportstatus{font-size:12px; color:var(--text-dim); font-family:'Share Tech Mono',monospace;}

  /* ---- packages ---- */
  .pkggrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px;}
  .pkgcard{background:var(--surface); border:1px solid var(--border); padding:16px; display:flex; flex-direction:column; gap:10px;}
  .pkgcard h3{font-size:15px; margin:0; color:var(--accent-cpu);}
  .pkgcard .blurb{font-size:12px; color:var(--text-dim); line-height:1.4; min-height:2.6em;}
  .pkgcard .parts{display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--text-dim);}
  .pkgcard .parts b{color:var(--text); font-weight:700;}
  .pkgcard .total{font-family:'Share Tech Mono',monospace; font-size:22px; font-weight:700;}
  .pkgcard .applybtn{appearance:none; border:1px solid var(--accent-gpu); background:var(--accent-gpu); color:#04181a; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.04em; padding:9px 12px; cursor:pointer;}
  .pkgcard .applybtn:hover{box-shadow:0 0 16px -4px var(--accent-gpu);}

  /* ---- segmented (resolution) ---- */
  .seg{display:inline-flex; border:1px solid var(--border);}
  .seg button{appearance:none; border:none; background:var(--surface); color:var(--text-dim); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; padding:7px 13px; cursor:pointer;}
  .seg button + button{border-left:1px solid var(--border);}
  .seg button[aria-pressed="true"]{background:var(--accent-gpu); color:#04181a;}

  /* ---- psu ---- */
  .psugrid{display:grid; grid-template-columns:1.1fr 1fr; gap:18px;}
  @media (max-width:720px){.psugrid{grid-template-columns:1fr;}}
  .psucard{background:var(--surface); border:1px solid var(--border); padding:18px; display:flex; flex-direction:column; gap:14px;}
  .drawline{display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px dashed var(--border);}
  .drawline .k{color:var(--text-dim);}
  .drawline .v{font-family:'Share Tech Mono',monospace; font-weight:700;}
  .psubig{font-family:'Share Tech Mono',monospace; font-size:34px; font-weight:700; color:var(--accent-gpu); text-shadow:0 0 14px color-mix(in srgb, var(--accent-gpu) 60%, transparent);}
  .slider{display:flex; flex-direction:column; gap:6px;}
  .slider input[type=range]{width:100%; accent-color:var(--accent-gpu);}
  .slider .row{display:flex; justify-content:space-between; font-size:12px; color:var(--text-dim);}

  /* ---- fps tiles ---- */
  .fpsgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px;}
  .fpstile{background:var(--surface); border:1px solid var(--border); padding:18px 16px; display:flex; flex-direction:column; gap:4px;}
  .fpsnum{font-family:'Share Tech Mono',monospace; font-size:36px; font-weight:700; color:var(--accent-gpu); line-height:1; text-shadow:0 0 14px color-mix(in srgb, var(--accent-gpu) 60%, transparent);}
  .fpsunit{font-size:14px; font-weight:700; color:var(--text-faint); margin-left:6px; text-shadow:none;}
  .fpsgame{font-size:13px; color:var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:.02em;}

  .sourcelist{display:flex; flex-wrap:wrap; gap:8px;}
  .sourcelist a{font-size:12px; background:var(--surface-2); border:1px solid var(--border); padding:5px 12px; text-decoration:none; text-transform:uppercase; letter-spacing:.02em;}
  .sourcelist a:hover{border-color:var(--accent-gpu); color:var(--accent-gpu);}
  .supportlinks{margin-top:8px;}
  .supportlinks a:first-child{border-color:var(--warn); color:var(--warn);}
  .supportlinks a:first-child:hover{border-color:var(--warn); color:var(--warn); opacity:.85;}

  footer{margin-top:28px; padding-top:16px; border-top:1px solid var(--border); font-size:11px; color:var(--text-faint); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; font-family:'Share Tech Mono',monospace;}
  footer button{background:none; border:none; color:var(--text-faint); text-decoration:underline; cursor:pointer; font-size:11px; font-family:inherit;}
</style>

<div class="topbar">
  <div class="brand">
    <h1>MakeMyPC</h1>
    <p>Gaming-PC planen &amp; vergleichen: AMD, Intel und Nvidia. Preise eintragen, CPU/GPU-Bottleneck prüfen, Netzteil-Watt berechnen, FPS schätzen.</p>
  </div>
  <div class="budgetbox">
    <div class="field">
      <label for="budgetInput">Budget-Limit</label>
      <input type="number" id="budgetInput" min="0" step="10">
    </div>
    <div class="totalpill cut cut-sm" id="totalPill">
      <span class="amount tabular" id="totalAmount">–</span>
      <span class="delta" id="totalDelta">–</span>
    </div>
  </div>
</div>

<div class="tabs" role="tablist" id="tabNav"></div>
<main id="panel"></main>

<div class="sourcelist supportlinks">
  <a href="https://www.paypal.com/paypalme/rapidr3dde" target="_blank" rel="noopener">Unterstützen (PayPal)</a>
  <a href="https://www.tiktok.com/@rapidr3d" target="_blank" rel="noopener">TikTok</a>
  <a href="https://rapidr3d.duckdns.org" target="_blank" rel="noopener">Webseite</a>
</div>

<footer>
  <span id="seedNote"></span>
  <button id="resetBtn" type="button">Auswahl zurücksetzen</button>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
"use strict";

var APP_SEED_DATE = "2026-09-26";

/* ---------------- reference data (static fallback / initial seed) ---------------- */
/* board-partner variants: three curated real-world tiers per card/board – günstigste, Preis-Leistungs-Sieger (Wertungsanker) und Top-Leistung.
   Preise sind absolute Werte je Variante (kein Aufschlag auf einen bereits gefundenen Preis), damit ein echter Fund
   (z. B. über "Preis prüfen") nicht doppelt verrechnet wird. */
function round2(x){ return Math.round(x*100)/100; }
var GPU_TIERS = {
  amd: [
    {brand:"ASUS", suffix:"Prime", ratio:0.985, label:"Günstigste", note:"Einfacher Kühler, günstigster Einstieg in diesen Chip."},
    {brand:"XFX", suffix:"Swift", ratio:1.00, label:"Preis-Leistungs-Sieger", note:"Bewährter Allrounder, gutes Verhältnis aus Preis und Kühlung."},
    {brand:"Sapphire", suffix:"Nitro+", ratio:1.13, label:"Top-Leistung", note:"Größter Kühler, höchstes Werks-OC, leisester Betrieb."}
  ],
  nvidia: [
    {brand:"ASUS", suffix:"Dual", ratio:0.96, label:"Günstigste", note:"Kompakter Kühler, günstigster Einstieg in diesen Chip."},
    {brand:"MSI", suffix:"Gaming X", ratio:1.02, label:"Preis-Leistungs-Sieger", note:"Bewährter Allrounder, gute Kühlung."},
    {brand:"Gigabyte", suffix:"Aorus Master", ratio:1.18, label:"Top-Leistung", note:"Premium-Kühler, höchstes Werks-OC."}
  ],
  intel: [
    {brand:"ASUS", suffix:"Dual", ratio:0.97, label:"Günstigste", note:"Einfache Basisvariante."},
    {brand:"Sparkle", suffix:"Titan", ratio:1.03, label:"Preis-Leistungs-Sieger", note:"Intels wichtigster Arc-Partner."},
    {brand:"Gigabyte", suffix:"Gaming OC", ratio:1.12, label:"Top-Leistung", note:"Größerer Kühler, leiser."}
  ]
};
var BOARD_TIERS = [
  {brand:"MSI", suffix:"Pro", ratio:0.93, label:"Günstigste", note:"Solide Basisausstattung."},
  {brand:"ASUS", suffix:"TUF Gaming", ratio:1.00, label:"Preis-Leistungs-Sieger", note:"Bessere Spannungsversorgung, teils mit WLAN."},
  {brand:"Gigabyte", suffix:"Aorus Elite", ratio:1.15, label:"Top-Leistung", note:"Mehr Ausstattung, oft mehr M.2-Slots."}
];
function mkGpuModels(anchorPrice, fam){
  return GPU_TIERS[fam].map(function(t){ return {brand:t.brand, suffix:t.suffix, label:t.label, note:t.note, price:round2(anchorPrice*t.ratio)}; });
}
function mkBoardModels(anchorPrice){
  return BOARD_TIERS.map(function(t){ return {brand:t.brand, suffix:t.suffix, label:t.label, note:t.note, price:round2(anchorPrice*t.ratio)}; });
}

var CPUS = [

  "1080p":{native:1.0, quality:1.25, balanced:1.45, performance:1.7},
  "1440p":{native:1.0, quality:1.35, balanced:1.6, performance:1.9},
  "4K":{native:1.0, quality:1.5, balanced:1.8, performance:2.3}
};
var UPSCALE_LABEL = {native:"Nativ", quality:"FSR4/DLSS4 Qualität", balanced:"Ausgewogen", performance:"Leistung"};
var PSU_TIERS = [450,550,650,750,850,1000,1200];
var PSU_EXAMPLES = {
  450:"be quiet! Pure Power 12 M 450W", 550:"Corsair RM550e / be quiet! Pure Power 12 M 550W",
  650:"Corsair RM650e / be quiet! Pure Power 12 M 650W", 750:"Corsair RM750e / be quiet! Straight Power 12 750W",
  850:"Corsair RM850e / Seasonic Focus GX-850", 1000:"Corsair RM1000e / Seasonic Focus GX-1000",
  1200:"Corsair HX1200i / Seasonic Prime PX-1200"
};

var PACKAGES = [
  {id:"pkg-einsteiger", name:"Einsteiger", blurb:"Solides Full-HD-Gaming zum kleinen Preis.", cpuId:"cpu-7500f", gpuId:"gpu-7600", ramId:"ram-ddr5-16-6000", boardId:"board-b650", storageId:"storage-nv3-500"},
  {id:"pkg-pl-amd", name:"Preis-Leistung (AMD)", blurb:"Starkes WQHD-Gaming, reiner AMD-Unterbau.", cpuId:"cpu-9600x", gpuId:"gpu-9070", ramId:"ram-ddr5-32-5600", boardId:"board-b650-wifi", storageId:"storage-p3plus-1tb"},
  {id:"pkg-pl-intel", name:"Preis-Leistung (Intel/Nvidia)", blurb:"Vergleichbare Leistung mit Intel-CPU und Nvidia-GPU.", cpuId:"cpu-i5-14600kf", gpuId:"gpu-4070super", ramId:"ram-ddr5-32-5600", boardId:"board-b760-ddr5", storageId:"storage-p3plus-1tb"},
  {id:"pkg-ausgewogen", name:"Ausgewogen", blurb:"Sehr starkes WQHD/4K-Gaming mit viel Reserve.", cpuId:"cpu-7800x3d", gpuId:"gpu-9070xt", ramId:"ram-ddr5-32-6000", boardId:"board-b650-wifi", storageId:"storage-sn850x-2tb"},
  {id:"pkg-highend", name:"High-End", blurb:"Maximale Gaming-Leistung, 4K mit hohen FPS.", cpuId:"cpu-9800x3d", gpuId:"gpu-5080", ramId:"ram-ddr5-32-6000", boardId:"board-x870", storageId:"storage-9100pro-2tb"}
];

/* ---------------- state ---------------- */
var state = {
  cpuId:"cpu-9600x", gpuId:"gpu-9070xt", ramId:"ram-ddr5-32-6000", boardId:"board-b650-wifi", storageId:"storage-sn770-1tb",
  budget:1500, resolution:"1440p", upscale:"quality", extraWatts:50, tab:"overview", overrides:{}, modelSel:{},
  cpuVendorFilter:"all", gpuVendorFilter:"all", cpuSort:"perf", gpuSort:"perf"
};
(function loadState(){
  try{
    var raw = localStorage.getItem("makemypc_v1");
    if(raw){
      var saved = JSON.parse(raw);
      for(var k in saved){ if(Object.prototype.hasOwnProperty.call(state,k)) state[k]=saved[k]; }
      if(!state.overrides) state.overrides = {};
    }
  }catch(e){ /* private mode / blocked storage: fall back to defaults */ }
})();
function saveState(){
  try{ localStorage.setItem("makemypc_v1", JSON.stringify(state)); }catch(e){}
}

function getModel(item){
  if(!item.models) return null;
  var idx = (typeof state.modelSel[item.id]==="number") ? state.modelSel[item.id] : (item.defaultModel||0);
  return item.models[idx] || item.models[0];
}
function overrideKeyFor(item, mo){ return mo ? (item.id+":"+item.models.indexOf(mo)) : item.id; }
function getDisplayName(item){
  var mo = getModel(item);
  return mo ? item.name+" – "+mo.brand+" "+mo.suffix : item.name;
}
function getSearchName(item){
  var mo = getModel(item);
  return mo ? item.name+" "+mo.brand+" "+mo.suffix : item.name;
}
function getPrice(item){
  var mo = getModel(item);
  var key = overrideKeyFor(item, mo);
  if(typeof state.overrides[key]==="number") return state.overrides[key];
  return mo ? mo.price : item.price;
}
function getPriceDate(item){
  return APP_SEED_DATE;
}
function isOverridden(item){ return typeof state.overrides[overrideKeyFor(item, getModel(item))]==="number"; }
function valueScore(item){ return item.index / getPrice(item) * 1000; }

function fmtEur(n){ return n.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function searchUrl(name){ return "https://geizhals.de/?fs="+encodeURIComponent(name); }

/* ---------------- derived ---------------- */
function getCurrent(){
  return {
    cpu:findItem("cpu",state.cpuId), gpu:findItem("gpu",state.gpuId),
    ram:findItem("ram",state.ramId), board:findItem("board",state.boardId),
    storage:findItem("storage",state.storageId)
  };
}
function currentTotal(){
  var c = getCurrent();
  return getPrice(c.cpu)+getPrice(c.gpu)+getPrice(c.ram)+getPrice(c.board)+getPrice(c.storage);
}
function pkgTotal(pkg){
  return getPrice(findItem("cpu",pkg.cpuId))+getPrice(findItem("gpu",pkg.gpuId))+getPrice(findItem("ram",pkg.ramId))+getPrice(findItem("board",pkg.boardId))+getPrice(findItem("storage",pkg.storageId));
}
function estimate(cpu,gpu,cat,res,upscale){
  upscale = upscale || "native";
  var gpuFpsNative = cat.gpuBase1440 * (gpu.index/100) * RES_GPU_MULT[res];
  var gpuFps = gpuFpsNative * UPSCALE_MULT[res][upscale];
  var cpuCeil = cat.cpuCap * (cpu.index/100) * RES_CPU_MULT[res];
  var effective = Math.min(gpuFps,cpuCeil);
  var gpuBound = gpuFps <= cpuCeil;
  var headroomPct = gpuBound ? Math.round((1-gpuFps/cpuCeil)*100) : Math.round((1-cpuCeil/gpuFps)*100);
  return {gpuFps:gpuFps, cpuCeil:cpuCeil, effective:effective, gpuBound:gpuBound, headroomPct:Math.max(0,headroomPct)};
}
function psuCalc(){
  var c = getCurrent();
  var draw = c.cpu.tdp + c.gpu.tdp + 75 + state.extraWatts;
  var recommended = Math.ceil(draw*1.3);
  var tier = PSU_TIERS.find(function(t){return t>=recommended;}) || PSU_TIERS[PSU_TIERS.length-1];
  return {draw:draw, recommended:recommended, tier:tier};
}
function boardsForCpu(cpu){ return BOARDS.filter(function(b){return b.socket===cpu.socket;}); }
function ramForBoard(board){ return RAM.filter(function(r){return r.memType===board.memType;}); }

/* ---------------- rendering ---------------- */
var TABS = [
  {id:"overview", label:"Übersicht"},
  {id:"packages", label:"Pakete"},
  {id:"config", label:"Konfigurator"},
  {id:"bench", label:"FPS"},
  {id:"psu", label:"Netzteil"}
];
function gotoTab(id){ state.tab=id; saveState(); render(); }

function render(){
  renderTopbar();
  renderTabNav();
  renderPanel();
  document.getElementById("seedNote").textContent = "Preise sind Richtwerte, Stand "+APP_SEED_DATE+". Nutze „Preis prüfen“ oder trage deinen gefundenen Preis manuell ein.";
}

function renderTopbar(){
  var b = document.getElementById("budgetInput");
  if(document.activeElement!==b) b.value = state.budget;
  var total = currentTotal();
  var delta = state.budget - total;
  document.getElementById("totalAmount").textContent = fmtEur(total)+" €";
  var d = document.getElementById("totalDelta");
  if(delta >= 0){
    d.textContent = fmtEur(delta)+" € Puffer";
    d.className = "delta status-ok";
  } else {
    d.textContent = fmtEur(Math.abs(delta))+" € über Budget";
    d.className = "delta status-bad";
  }
}

function renderTabNav(){
  var nav = document.getElementById("tabNav");
  nav.innerHTML = "";
  TABS.forEach(function(t){
    var btn = document.createElement("button");
    btn.textContent = t.label;
    btn.setAttribute("role","tab");
    btn.setAttribute("aria-selected", state.tab===t.id ? "true":"false");
    btn.addEventListener("click", function(){ state.tab=t.id; saveState(); render(); });
    nav.appendChild(btn);
  });
}

function card(item, selected, extraClass, showIndex, isBestValue){
  var wrap = document.createElement("button");
  wrap.type="button";
  wrap.className = "card cut"+(selected?" selected":"")+(extraClass?" "+extraClass:"");
  var price = getPrice(item);
  var chips = "";

  if(item.category==="gpu") chips = '<span class="chip">'+item.vram+' GB</span><span class="chip">'+item.tdp+'W</span>';
  if(item.category==="ram") chips = '<span class="chip">'+item.memType.toUpperCase()+'-'+item.speed+'</span><span class="chip">'+item.capacity+' GB</span><span class="chip">CL'+item.cl+'</span>';
  if(item.category==="board") chips = '<span class="chip">'+item.socket+'</span><span class="chip">'+item.chipset+'</span>';
  if(item.category==="storage") chips = '<span class="chip">'+item.interface+'</span><span class="chip">'+(item.capacity>=1000 ? (item.capacity/1000)+" TB" : item.capacity+" GB")+'</span>';

  var idxHtml = "";
  if(showIndex){
    var barClass = item.category==="cpu" ? "cpu":"gpu";
    idxHtml = '<div class="idxbar-track"><div class="idxbar-fill '+barClass+'" style="width:'+Math.min(100,item.index)+'%"></div></div>';
  }
  var vendorTag = item.vendor ? '<span class="vendortag">'+VENDOR_LABEL[item.vendor]+'</span>' : "";
  var displayName = getDisplayName(item);

  wrap.innerHTML =
    '<div class="toprow"><div class="nameblock"><span class="cardicon '+item.category+'">'+CATEGORY_ICON[item.category]+'</span><span class="name">'+displayName+'</span></div>'+vendorTag+'</div>'+
    '<span class="chips">'+chips+'</span>'+
    idxHtml+
    (isBestValue ? '<span class="valuebadge">Bestes Preis/Leistungs-Verhältnis</span>' : "")+
    '<span class="note">'+item.note+'</span>'+
    '<span class="pricedate">Preis-Stand: '+getPriceDate(item)+(isOverridden(item)?" · eigener Preis":"")+'</span>';

  var curModel = getModel(item);
  if(item.models){
    var picker = document.createElement("div"); picker.className="modelpicker";
    var curIdx = item.models.indexOf(curModel);
    item.models.forEach(function(mo, idx){
      var b = document.createElement("button");
      b.type="button"; b.textContent=mo.brand+" · "+fmtEur(mo.price)+" €";
      b.setAttribute("aria-pressed", idx===curIdx ? "true":"false");
      b.title = mo.brand+" "+mo.suffix+" ("+mo.label+") – "+mo.note;
      b.addEventListener("click", function(e){ e.stopPropagation(); state.modelSel[item.id]=idx; saveState(); render(); });
      picker.appendChild(b);
    });
    wrap.appendChild(picker);
    var tierTag = document.createElement("span");
    tierTag.className = "valuebadge";
    tierTag.style.color = "var(--accent-gpu)"; tierTag.style.background="var(--accent-gpu-bg)"; tierTag.style.borderColor="var(--accent-gpu)";
    tierTag.textContent = curModel.label;
    wrap.appendChild(tierTag);
  }

  var priceRow = document.createElement("div");
  priceRow.className = "pricerow";
  var input = document.createElement("input");
  input.type="number"; input.min="0"; input.step="0.01"; input.value=price;
  input.addEventListener("click", function(e){ e.stopPropagation(); });
  input.addEventListener("change", function(){
    var v = parseFloat(input.value);
    if(!isNaN(v) && v>=0){ state.overrides[overrideKeyFor(item, getModel(item))]=v; saveState(); render(); }
  });
  var eur = document.createElement("span"); eur.className="eur"; eur.textContent="€";
  var link = document.createElement("a");
  link.className="searchlink"; link.href=searchUrl(getSearchName(item)); link.target="_blank"; link.rel="noopener";
  link.textContent="Preis prüfen ↗";
  link.addEventListener("click", function(e){ e.stopPropagation(); });
  priceRow.appendChild(input); priceRow.appendChild(eur); priceRow.appendChild(link);
  if(isOverridden(item)){
    var reset = document.createElement("button");
    reset.type="button"; reset.className="resetbtn"; reset.textContent="zurücksetzen";
    reset.addEventListener("click", function(e){ e.stopPropagation(); delete state.overrides[overrideKeyFor(item, getModel(item))]; saveState(); render(); });
    priceRow.appendChild(reset);
  }
  wrap.appendChild(priceRow);

  wrap.addEventListener("click", function(){ selectItem(item.category, item.id); });
  return wrap;
}

function selectItem(cat, id){
  if(cat==="cpu"){
    state.cpuId = id;
    var cpu = findItem("cpu", id);
    var compatBoards = boardsForCpu(cpu);
    var curBoard = findItem("board", state.boardId);
    if(!compatBoards.some(function(b){return b.id===curBoard.id;})){
      var nb = compatBoards[0]; if(nb) state.boardId = nb.id;
    }
    var board2 = findItem("board", state.boardId);
    var compatRam = ramForBoard(board2);
    var curRam = findItem("ram", state.ramId);
    if(!compatRam.some(function(r){return r.id===curRam.id;})){
      var nr = compatRam[0]; if(nr) state.ramId = nr.id;
    }
  } else if(cat==="gpu"){ state.gpuId=id; }
  else if(cat==="board"){
    state.boardId = id;
    var board = findItem("board", id);
    var compatRam2 = ramForBoard(board);
    var curRam2 = findItem("ram", state.ramId);
    if(!compatRam2.some(function(r){return r.id===curRam2.id;})){
      var nr2 = compatRam2[0]; if(nr2) state.ramId = nr2.id;
    }
  }
  else if(cat==="ram"){ state.ramId=id; }
  else if(cat==="storage"){ state.storageId=id; }
  saveState();
  render();
}

function sortItems(list, mode){
  var arr = list.slice();
  if(mode==="value") arr.sort(function(a,b){ return valueScore(b)-valueScore(a); });
  else if(mode==="perf") arr.sort(function(a,b){ return b.index-a.index; });
  else if(mode==="price") arr.sort(function(a,b){ return getPrice(a)-getPrice(b); });
  return arr;
}

function catBlock(title, items, cat, selectedId, showIndex, opts){
  opts = opts || {};
  var block = document.createElement("div");
  block.className="catblock";
  var header = document.createElement("div"); header.className="catheader";
  var h = document.createElement("h2"); h.textContent=title; header.appendChild(h);

  var controls = document.createElement("div"); controls.className="catcontrols";
  var vendors = null, vendorFilterKey=null, sortKey=null;
  if(cat==="cpu"){ vendors=["all","amd","intel"]; vendorFilterKey="cpuVendorFilter"; sortKey="cpuSort"; }
  if(cat==="gpu"){ vendors=["all","amd","nvidia","intel"]; vendorFilterKey="gpuVendorFilter"; sortKey="gpuSort"; }

  if(vendors){
    var vf = document.createElement("div"); vf.className="vendorfilter";
    vendors.forEach(function(v){
      var b = document.createElement("button");
      b.textContent = v==="all" ? "Alle" : VENDOR_LABEL[v];
      b.setAttribute("aria-pressed", state[vendorFilterKey]===v ? "true":"false");
      b.addEventListener("click", function(){ state[vendorFilterKey]=v; saveState(); render(); });
      vf.appendChild(b);
    });
    controls.appendChild(vf);

    var sel = document.createElement("select"); sel.className="sortselect";
    [["default","Empfohlen"],["value","Beste Preis-Leistung"],["perf","Höchste Leistung"],["price","Günstigster Preis"]].forEach(function(o){
      var opt = document.createElement("option"); opt.value=o[0]; opt.textContent=o[1];
      if(state[sortKey]===o[0]) opt.selected=true;
      sel.appendChild(opt);
    });
    sel.addEventListener("change", function(){ state[sortKey]=sel.value; saveState(); render(); });
    controls.appendChild(sel);
  }
  header.appendChild(controls);
  block.appendChild(header);

  var grid = document.createElement("div"); grid.className="cardgrid";
  var cpuSock = findItem("cpu", state.cpuId).socket;
  var boardMem = findItem("board", state.boardId).memType;
  var filtered = items;
  if(cat==="ram") filtered = items.filter(function(i){return i.memType===boardMem;}).sort(function(a,b){ if(b.capacity!==a.capacity) return b.capacity-a.capacity; if(b.speed!==a.speed) return b.speed-a.speed; return a.cl-b.cl; });
  if(cat==="board") filtered = items.filter(function(i){return i.socket===cpuSock;}).sort(function(a,b){return getPrice(b)-getPrice(a);});
  if(cat==="cpu" && state.cpuVendorFilter!=="all") filtered = filtered.filter(function(i){return i.vendor===state.cpuVendorFilter;});
  if(cat==="gpu" && state.gpuVendorFilter!=="all") filtered = filtered.filter(function(i){return i.vendor===state.gpuVendorFilter;});

  var bestValueId = null;
  if(cat==="cpu"||cat==="gpu"){
    var byValue = items.slice().sort(function(a,b){return valueScore(b)-valueScore(a);});
    bestValueId = byValue.length ? byValue[0].id : null;
  }

  var sortMode = cat==="cpu" ? state.cpuSort : (cat==="gpu" ? state.gpuSort : "default");
  var ordered = (cat==="cpu"||cat==="gpu") ? sortItems(filtered, sortMode) : filtered;

  ordered.forEach(function(item){
    grid.appendChild(card(item, item.id===selectedId, cat==="cpu"?"cpu-sel":"", !!showIndex, item.id===bestValueId));
  });
  block.appendChild(grid);
  return block;
}

function renderPanel(){
  var panel = document.getElementById("panel");
  panel.innerHTML = "";
  var section = document.createElement("section");
  section.setAttribute("role","tabpanel");

  if(state.tab==="overview"){
    section.appendChild(buildOverviewPanel());
  }
  if(state.tab==="packages"){
    section.appendChild(buildPackagesPanel());
  }
  if(state.tab==="config"){
    var info = document.createElement("div");
    info.className="noticebar info";
    info.textContent = "Der Leistungsindex ist herstellerübergreifend vergleichbar (relative Gaming-Leistung, kein synthetischer Benchmark). Radeon RX 9070 XT und Ryzen 7 9800X3D sind jeweils auf 100 normiert.";
    section.appendChild(info);
    section.appendChild(catBlock("Prozessor (CPU)", CPUS, "cpu", state.cpuId, true));
    section.appendChild(catBlock("Grafikkarte (GPU)", GPUS, "gpu", state.gpuId, true));
    section.appendChild(catBlock("Arbeitsspeicher (RAM)", RAM, "ram", state.ramId, false));
    section.appendChild(catBlock("Speicher (SSD/NVMe)", STORAGE, "storage", state.storageId, false));
    section.appendChild(catBlock("Mainboard", BOARDS, "board", state.boardId, false));
    section.appendChild(buildSummaryCard());
  }
  if(state.tab==="psu"){
    section.appendChild(buildPsuPanel());
  }
  if(state.tab==="bench"){
    section.appendChild(buildResSelector());
    section.appendChild(buildBenchPanel());
  }
  panel.appendChild(section);
}

      '</div>'+

/* jsPDF's core fonts only cover WinAnsi – unicode dashes/arrows render as garbage glyphs, so every string
   passed to the PDF is sanitized to plain ASCII first. */
function pdfSafe(s){
  return String(s)
    .replace(/[–—]/g,"-")
    .replace(/→/g,"->")
    .replace(/[·•]/g,"-")
    .replace(/[‘’]/g,"'")
    .replace(/[“”]/g,'"')
    .replace(/€/g,"EUR");
}
var PDF_BG = [8,8,11], PDF_YELLOW=[252,238,9], PDF_CYAN=[0,220,230], PDF_WHITE=[230,230,235], PDF_DIM=[130,130,145], PDF_MAGENTA=[255,42,109];

function buildPdfDoc(){
  var c = getCurrent();
  var total = currentTotal();
  var delta = state.budget - total;
  var psu = psuCalc();
  var doc = new window.jspdf.jsPDF();
  var marginL = 16, marginR = 194, y = 22;

  function paintBg(){
    doc.setFillColor(PDF_BG[0],PDF_BG[1],PDF_BG[2]); doc.rect(0,0,210,297,"F");
  }
  function ensureSpace(lines){ if(y + lines*6 > 278){ doc.addPage(); paintBg(); y = 20; } }
  function txt(s, x, yy, color, font, size){
    doc.setFont(font||"courier", size&&size>13?"bold":"normal");
    doc.setFontSize(size||10);
    doc.setTextColor(color[0],color[1],color[2]);
    doc.text(pdfSafe(s), x, yy);
  }
  function rule(color){
    doc.setDrawColor(color[0],color[1],color[2]); doc.setLineWidth(0.6);
    doc.line(marginL, y, marginR, y); y += 5;
  }
  function sectionTitle(t){
    ensureSpace(4);
    txt("// "+t, marginL, y, PDF_CYAN, "courier", 13); y += 3;
    rule(PDF_MAGENTA); y += 3;
  }
  function partBlock(label, item, specLine){
    ensureSpace(5);
    txt("["+label+"]", marginL, y, PDF_YELLOW, "courier", 10);
    txt(getDisplayName(item), marginL+26, y, PDF_WHITE, "courier", 10); y += 5.5;
    txt(specLine, marginL+26, y, PDF_DIM, "courier", 9); y += 5.5;
    txt("PREIS: "+fmtEur(getPrice(item))+" EUR  (Richtwert, Stand "+getPriceDate(item)+")", marginL+26, y, PDF_WHITE, "courier", 9); y += 5.5;
    doc.setFont("courier","normal"); doc.setFontSize(9); doc.setTextColor(PDF_CYAN[0],PDF_CYAN[1],PDF_CYAN[2]);
    doc.textWithLink("> KAUFLINK / PREIS PRUEFEN", marginL+26, y, {url: searchUrl(getSearchName(item))});
    y += 9;
  }

  paintBg();
  txt("MAKEMYPC", marginL, y, PDF_YELLOW, "courier", 22); y += 2;
  doc.setDrawColor(PDF_YELLOW[0],PDF_YELLOW[1],PDF_YELLOW[2]); doc.setLineWidth(1.2); doc.line(marginL,y,marginR,y); y += 7;
  txt("BUILD-ZUSAMMENFASSUNG", marginL, y, PDF_MAGENTA, "courier", 12); y += 7;
  txt("Erstellt am "+new Date().toLocaleDateString("de-DE")+"  //  Budget-Limit: "+fmtEur(state.budget)+" EUR", marginL, y, PDF_DIM, "courier", 9); y += 10;

  sectionTitle("DEINE KONFIGURATION");
  partBlock("CPU", c.cpu, c.cpu.socket+" - "+c.cpu.cores+"C/"+c.cpu.threads+"T - "+c.cpu.tdp+" W");
  partBlock("GPU", c.gpu, c.gpu.vram+" GB VRAM - "+c.gpu.tdp+" W");
  partBlock("RAM", c.ram, c.ram.memType.toUpperCase()+"-"+c.ram.speed+" CL"+c.ram.cl+" - "+c.ram.capacity+" GB");
  partBlock("SSD", c.storage, c.storage.interface+" - "+(c.storage.capacity>=1000 ? (c.storage.capacity/1000)+" TB" : c.storage.capacity+" GB"));
  partBlock("BOARD", c.board, c.board.socket+" - "+c.board.chipset);

  ensureSpace(4);
  txt("GESAMTPREIS: "+fmtEur(total)+" EUR", marginL, y, PDF_YELLOW, "courier", 15); y += 6.5;
  txt(delta>=0
    ? (fmtEur(delta)+" EUR Puffer zum Budget-Limit von "+fmtEur(state.budget)+" EUR")
    : (fmtEur(Math.abs(delta))+" EUR UEBER dem Budget-Limit von "+fmtEur(state.budget)+" EUR"),
    marginL, y, delta>=0 ? [5,255,161] : [255,34,71], "courier", 10);
  y += 11;

  sectionTitle("NETZTEIL-EMPFEHLUNG");
  txt("Rechnerische Last: "+psu.draw+" W  //  empfohlen mit Reserve: mind. "+psu.recommended+" W", marginL, y, PDF_WHITE, "courier", 10); y += 5.5;
  txt("Empfohlene Klasse: "+psu.tier+" W  (z.B. "+psu.tier+"W-Modelle wie "+PSU_EXAMPLES[psu.tier]+")", marginL, y, PDF_WHITE, "courier", 10); y += 10;

  sectionTitle("GESCHAETZTE FPS  ("+state.resolution+", "+UPSCALE_LABEL[state.upscale]+")");
  GAMES.forEach(function(g){
    var r = estimate(c.cpu, c.gpu, g, state.resolution, state.upscale);
    ensureSpace(1);
    txt(g.label, marginL, y, PDF_WHITE, "courier", 10);
    txt("ca. "+Math.round(r.effective)+" FPS", marginR-30, y, PDF_CYAN, "courier", 10);
    y += 5.8;
  });
  y += 5;

  ensureSpace(8);
  rule(PDF_DIM);
  doc.setFont("courier","normal"); doc.setFontSize(7.5); doc.setTextColor(PDF_DIM[0],PDF_DIM[1],PDF_DIM[2]);
  var disc = doc.splitTextToSize(pdfSafe("Preise sind Richtwerte, keine Live-Daten - vor dem Kauf pruefen. Kauflinks fuehren zu einer Geizhals-Suche nach dem Produktnamen, kein direkter Shop-Link. FPS-Werte sind eine Modellrechnung, keine echten Messwerte."), 178);
  doc.text(disc, marginL, y);

  return doc;
}

function onExportPdf(){
  var btn = document.getElementById("exportPdfBtn");
  if(btn) btn.disabled = true;
  setExportStatus("PDF wird erstellt …");
  if(!window.jspdf || !window.jspdf.jsPDF){
    setExportStatus("PDF-Bibliothek konnte nicht geladen werden. Versuch es später erneut.");
    if(btn) btn.disabled = false;
    return;
  }
  if(!(window.claude && window.claude.use)){
    setExportStatus("PDF-Speichern ist nur innerhalb von Claude verfügbar.");
    if(btn) btn.disabled = false;
    return;
  }
  /* Außerhalb der Claude-Sandbox (z. B. als eigenständig gehostete Seite) blockiert nichts einen
     normalen Browser-Download – dort speichert jsPDF direkt. Nur innerhalb des Claude-Artifact-Viewers
     braucht es die downloads-Capability, weil die Sandbox dort eigene Downloads unterbindet. */
  if(!(window.claude && window.claude.use)){
    try{
      var doc = buildPdfDoc();
      doc.save("makemypc-build.pdf");
      setExportStatus("PDF gespeichert.");
    }catch(e){ setExportStatus("PDF konnte nicht erstellt werden."); }
    if(btn) btn.disabled = false;
    return;
  }

  var blob;
  try{ blob = buildPdfDoc().output("blob"); }
  catch(e){ setExportStatus("PDF konnte nicht erstellt werden."); if(btn) btn.disabled=false; return; }

  window.claude.use("downloads").then(function(downloads){
    if(!downloads){ setExportStatus("Speichern ist in dieser Ansicht nicht verfügbar."); if(btn) btn.disabled=false; return; }
    return downloads.save({filename:"makemypc-build.pdf", data:blob}).then(function(){
      setExportStatus("PDF gespeichert.");
      if(btn) btn.disabled = false;
    });
  }).catch(function(err){
    var code = err && err.code;
    if(code==="declined"){ setExportStatus("Speichern abgebrochen."); }
    else { setExportStatus("Speichern fehlgeschlagen."); }
    if(btn) btn.disabled = false;
  });
}

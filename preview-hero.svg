<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2a6d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff2a6d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f6ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" fill="#0a0a0d"/>
  <rect width="1200" height="280" fill="url(#glow1)"/>
  <rect width="1200" height="280" fill="url(#glow2)"/>
  <!-- fine scanlines -->
  <g opacity="0.05">
    <rect x="0" y="0" width="1200" height="280" fill="#ffffff"/>
  </g>
  <!-- corner-cut frame -->
  <path d="M20 20 H1160 L1180 40 V240 L1160 260 H40 L20 240 Z" fill="none" stroke="#33333d" stroke-width="2"/>
  <!-- accent corner ticks -->
  <path d="M20 60 V20 H60" fill="none" stroke="#fcee09" stroke-width="4"/>
  <path d="M1180 220 V260 H1140" fill="none" stroke="#00f6ff" stroke-width="4"/>

  <text x="70" y="140" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="800" fill="#fcee09" letter-spacing="4" style="text-shadow:0 0 20px #fcee09">MAKEMYPC</text>
  <text x="72" y="185" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#00f6ff" letter-spacing="2">AMD &#183; INTEL &#183; NVIDIA &#8212; PC-CONFIGURATOR</text>

  <!-- tag chips -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#9a9aa8">
    <rect x="72" y="205" width="70" height="26" fill="#1b1b22" stroke="#33333d"/>
    <text x="86" y="223">CPU</text>
    <rect x="150" y="205" width="70" height="26" fill="#1b1b22" stroke="#33333d"/>
    <text x="164" y="223">GPU</text>
    <rect x="228" y="205" width="74" height="26" fill="#1b1b22" stroke="#33333d"/>
    <text x="240" y="223">RAM</text>
    <rect x="310" y="205" width="70" height="26" fill="#1b1b22" stroke="#33333d"/>
    <text x="322" y="223">SSD</text>
    <rect x="388" y="205" width="94" height="26" fill="#1b1b22" stroke="#33333d"/>
    <text x="400" y="223">BOARD</text>
  </g>
</svg>
